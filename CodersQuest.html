ived down in that basement since '99. I keep telling him to take a vacation. He keeps telling me the Monolith would get lonely."],[/photo|picture|1987|garage|founding|history/,"Day one. Denis and me, and the Monolith, the day we turned her on. We said we'd fix the date handling 'before it matters.' I'm sure we did. Didn't we?"],[/aidan|intern|runbook/,"Poor kid. Don't tell him I said this, but he followed the runbook perfectly. I wrote that runbook. In 1999. Maybe I should update the runbook."],[/fahim|sre|on ?call|noc/,"Fahim is the best SRE I've ever had. He writes beautiful incident reports. I have them framed. Well. Laminated. He's in the NOC, if he's conscious."],[/krishna|lab|helmet|ndi/,"Krishna's building a helmet that lets you debug from the inside. Legal says it's fine as long as nobody uses it. So please don't tell Legal."],[/adriana|architect/,"Adriana went down to the basement to look into a date bug hours ago. I'm sure she's fine. She's the smartest person in the building. Present company... included, mostly."],[/mike|sales|quantum/,"Mike sold Quantum Sync to the investors. I don't know what Quantum Sync is. Neither does Mike. It's on the roadmap now."],[/nicholas|nick|div|website/,"Nicholas? Lovely kid. Has he centered that thing yet? The... the box? He's been at it since Tuesday."],[/golf|putt|green|putter|ball|club|trophies|trophy/,"Golf teaches patience, Dominic. Patience, focus, and how to lose gracefully. Mostly the last one."],[/monolith|mainframe/,"The Monolith has run this company since 1987. Payroll, billing, the doors, the elevators, the coffee machine, the parking gate. Every time someone suggested replacing it, the estimate came back bigger than the company. So we... didn't."],[/report|incident|paperwork|form|sev/,e=>e.flag("phil_gave_keycard")?"Fahim's report is going in the binder. Volume twelve. Right next to his other beautiful reports.":e.has("report")?"Is that it? Is that the report? Well, don't just stand there waving it around, Dominic. SHOW it to me.":"An incident report, filed and signed by the on-call SRE. That's Fahim, in the NOC. He writes beautiful reports. When he's awake."],[/key ?card|master key|keys?$|card|access|clearance|stair|basement|lockdown|door|elevator|permission|authori/,e=>e.flag("phil_gave_keycard")?"The keycard opens everything: the stairwell, the basement, every door in the building. And the executive bathroom. Please. Not the executive bathroom.":"My master keycard opens the stairwell and every other door in the building. It's yours the moment I see an incident report from the on-call SRE. Rules are rules. I laminated them."],[/investor|henderson|demo|monday|call|phone|money|funding/,"(covering the phone) Mr. Henderson. Lead investor. He arrives Monday at nine with four colleagues and a very large checkbook. The demo has to work, Dominic. It HAS to."],[/coffee|teapot|smartbrew/,"The coffee machine is on the Monolith too? Of course it is. I signed that contract myself. The SmartBrew salesman was very persuasive."],[/rules|binder|rule book|policy|process|section/,"Volume twelve. I'm drafting volume thirteen: 'Rules About Rules.' It's going to be my best work."],[/swear|jar|curse/,"A dollar a swear. Tonight alone I have funded Q3 bowling and most of Q4."],[/bathroom|toilet|restroom|washroom/,"The executive bathroom is for executives. It has a heated seat. Let's not talk about the executive bathroom."],[/synergy|poster/,"Synergy, Dominic. It means we all work together. Tonight it mostly means you work and I hold the phone."],[/outage|production|prod|down|panic|crash/,"(into the phone) Yes, Mr. Henderson, everything is fine. It's a... planned... feature. (covering the phone) It is not fine, Dominic. Fix it."]];function ul(e,t,o){const a=(e.flag(t)??0)%o.length;return e.inc(t),o[a]}const su={id:"phil",title:"Phil's Office",act:1,music:"office",start:[270,160,"left"],draw:tu,walk:[[0,137,ee,Be+8,je,Be+8,320,137,320,189,0,189]],blocks:[[98,128,112,25],[36,104,156,8],[262,104,3
